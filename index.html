<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionario · Aparato Femenino</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#0d111b;color:#e9edf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:min(760px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:18px;margin:0}.muted,.count,.small{color:#9ba7bf;font-size:13px}.track{height:5px;background:#283248;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:#7695f7;width:0;transition:width .2s}.panel{background:#171d2b;border:1px solid #303a52;border-radius:18px;padding:clamp(20px,4vw,32px)}.count{letter-spacing:.08em;font-weight:700}h2{font-size:clamp(19px,3vw,24px);line-height:1.45;margin:16px 0 26px}.choices{display:grid;gap:11px}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#20283a;color:#e9edf7;border:1px solid #35405a;border-radius:12px;padding:15px;font-size:15px;line-height:1.5;cursor:pointer}.choice.selected{border-color:#8da4f6;background:#304365}.choice:hover:not(:disabled){border-color:#8da4f6;background:#28334b}.choice:disabled{cursor:default;opacity:1}.letter{flex:none;display:grid;place-items:center;border:1px solid #4a5775;width:32px;height:32px;border-radius:9px;font-weight:700}.choice.good{border-color:#39a977;background:#183c32}.choice.bad{border-color:#dd6875;background:#45252f}.feedback{margin-top:17px;font-size:14px;font-weight:650}.feedback.good{color:#6cddb0}.feedback.bad{color:#ff9aa5}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}.actions{display:flex;gap:10px}.nav{border:1px solid #3c4862;background:#263047;color:#eef1fa;padding:11px 17px;border-radius:10px;cursor:pointer;font-weight:650}.nav.primary{background:#7795f4;border-color:#7795f4;color:#0d1529}.nav:disabled{opacity:.38;cursor:default}.result{text-align:center;padding:40px 10px}.score{font-size:58px;font-weight:800;margin:12px 0}.result p{color:#a9b7d2}.review{margin-top:25px;text-align:left}.review-item{border:1px solid #35405a;border-radius:12px;padding:16px;margin:12px 0;background:#20283a}.review-item h3{font-size:15px;line-height:1.5;margin:0 0 10px}.review-item p{font-size:14px;line-height:1.5;margin:6px 0}.wrong{color:#ff9aa5}.right{color:#6cddb0}.pending{color:#e9c77d}.actions{flex-wrap:wrap;justify-content:flex-end}.result .score{line-height:1.1}</style></head><body><main class="wrap"><header><h1>Aparato Femenino</h1><span id="scoreTop" class="muted"></span></header><div class="track"><div id="bar" class="bar"></div></div><section class="panel" id="screen"></section></main><script>
const questions=[{"n": 1, "q": "¿De qué estructura derivan las trompas, el útero y el cérvix?", "opts": {"A": "Conductos de Wolff", "B": "Conductos de Müller", "C": "Seno urogenital", "D": "Cloaca"}, "correct": "B"}, {"n": 2, "q": "¿Qué estructura deriva del seno urogenital?", "opts": {"A": "Útero", "B": "Trompa de Falopio", "C": "Parte inferior de la vagina", "D": "Ovario"}, "correct": "C"}, {"n": 3, "q": "Los quistes de Gartner derivan de restos de:", "opts": {"A": "Conducto de Müller", "B": "Conducto de Wolff", "C": "Epitelio celómico", "D": "Seno urogenital"}, "correct": "B"}, {"n": 4, "q": "¿Qué hallazgo citológico es típico de la infección por VHS?", "opts": {"A": "Coilocitos", "B": "Células multinucleadas en vidrio esmerilado", "C": "Células de Paget", "D": "Perlas de queratina"}, "correct": "B"}, {"n": 5, "q": "¿Qué virus produce pápulas umbilicadas en cúpula?", "opts": {"A": "VPH", "B": "VHS", "C": "Virus del molusco contagioso", "D": "Chlamydia"}, "correct": "C"}, {"n": 6, "q": "¿Qué microorganismo causa la imagen en «cuello de fresa»?", "opts": {"A": "Gardnerella vaginalis", "B": "Trichomonas vaginalis", "C": "Candida albicans", "D": "Neisseria gonorrhoeae"}, "correct": "B"}, {"n": 7, "q": "¿Qué bacteria produce flujo con olor similar al pescado?", "opts": {"A": "Mycoplasma hominis", "B": "Ureaplasma urealyticum", "C": "Gardnerella vaginalis", "D": "Streptococcus del grupo B"}, "correct": "C"}, {"n": 8, "q": "Las infecciones puerperales se propagan al útero a través de:", "opts": {"A": "La mucosa únicamente", "B": "Vías linfáticas o venosas", "C": "Líquido peritoneal", "D": "Glándulas sudoríparas"}, "correct": "B"}, {"n": 9, "q": "¿Cuál es una secuela de la salpingitis crónica?", "opts": {"A": "Quiste de Gartner", "B": "Acantosis", "C": "Hidrosalpinx e infertilidad", "D": "Enfermedad de Paget"}, "correct": "C"}, {"n": 10, "q": "¿Cómo se llama clínicamente a la placa blanca y engrosada vulvar?", "opts": {"A": "Leucoplasia", "B": "Condiloma", "C": "Eritroplasia", "D": "Hidroadenoma"}, "correct": "A"}, {"n": 11, "q": "¿Qué hallazgo histológico caracteriza al liquen escleroso?", "opts": {"A": "Engrosamiento epidérmico", "B": "Adelgazamiento epidérmico y esclerosis dérmica", "C": "Células en vidrio esmerilado", "D": "Nidos de células basaloides"}, "correct": "B"}, {"n": 12, "q": "La hiperplasia de células escamosas de vulva se debe a:", "opts": {"A": "Infección por VPH", "B": "Roce o rascado crónico", "C": "Alteración mulleriana", "D": "Metástasis"}, "correct": "B"}, {"n": 13, "q": "¿Qué tipos de VPH causan el condiloma acuminado?", "opts": {"A": "16 y 18", "B": "6 y 11", "C": "31 y 33", "D": "1 y 2"}, "correct": "B"}, {"n": 14, "q": "¿Qué porcentaje de cánceres vulvares NO se relaciona con VPH?", "opts": {"A": "10%", "B": "30%", "C": "70%", "D": "90%"}, "correct": "C"}, {"n": 15, "q": "Paciente mujer de 78 años acude a consulta por prurito vulvar crónico de varios años de evolución. En el examen físico presenta una zona indurada sobre una base de liquen escleroso. La biopsia muestra atipia confinada a la capa basal con maduración de capas superficiales y mutación de TP53. ¿Cuál es el diagnóstico de esta lesión precursora?", "opts": {"A": "Neoplasia intraepitelial vulvar clásica (VIN clásica)", "B": "Neoplasia intraepitelial vulvar diferenciada (VIN diferenciada)", "C": "Condiloma acuminado", "D": "Enfermedad de Paget extramamaria"}, "correct": "B"}, {"n": 16, "q": "¿Qué gen suele mutar en la VIN diferenciada?", "opts": {"A": "BRCA1", "B": "KRAS", "C": "TP53", "D": "BRAF"}, "correct": "C"}, {"n": 17, "q": "El hidroadenoma papilar vulvar es idéntico a qué tumor mamario:", "opts": {"A": "Papiloma intraductal", "B": "Fibroadenoma", "C": "Carcinoma ductal", "D": "Tumor filodes"}, "correct": "A"}, {"n": 18, "q": "La enfermedad de Paget extramamaria vulvar se caracteriza por:", "opts": {"A": "Estar asociada siempre a cáncer subyacente", "B": "Limitarse habitualmente a la epidermis", "C": "Ser causada por un poxvirus", "D": "No requerir cirugía"}, "correct": "B"}, {"n": 19, "q": "¿Qué marcador es positivo en la enfermedad de Paget vulvar?", "opts": {"A": "CD20", "B": "Citoqueratina 7", "C": "CD3", "D": "Vimentina"}, "correct": "B"}, {"n": 20, "q": "¿La exposición a qué fármaco intrauterino causó adenosis vaginal?", "opts": {"A": "Aciclovir", "B": "Penicilina", "C": "Dietilestilbestrol", "D": "Tamoxifeno"}, "correct": "C"}, {"n": 21, "q": "¿Dónde se originan casi todas las neoplasias del cérvix?", "opts": {"A": "Endocérvix profundo", "B": "Zona de transformación", "C": "Exocérvix queratinizado", "D": "Estroma paracervical"}, "correct": "B"}, {"n": 22, "q": "¿El tumor maligno más frecuente del cuello uterino es?", "opts": {"A": "Adenocarcinoma", "B": "Carcinoma de células escamosas", "C": "Sarcoma", "D": "Linfoma"}, "correct": "B"}, {"n": 23, "q": "¿El carcinoma endometrial Tipo II (seroso) se caracteriza por?", "opts": {"A": "Expresión de receptores hormonales alta", "B": "Mutación de PTEN", "C": "Mutación de p53 y mal pronóstico", "D": "Buen pronóstico"}, "correct": "C"}, {"n": 24, "q": "¿Qué define histológicamente a una lesión de alto grado (HSIL / CIN II-III)?", "opts": {"A": "Atipia limitada al tercio inferior", "B": "Células atípicas e inmaduras en los dos tercios superiores o todo el espesor", "C": "Invasión estromal menor de 3 mm", "D": "Coilocitos aislados en capa superficial"}, "correct": "B"}, {"n": 25, "q": "A los 2 años de seguimiento, ¿cuál es la evolución de la mayoría de las lesiones LSIL?", "opts": {"A": "Progresión a carcinoma (60%)", "B": "Persistencia sin cambios (80%)", "C": "Regresión espontánea (60%)", "D": "Progresión a HSIL (50%)"}, "correct": "C"}, {"n": 26, "q": "Mujer de 33 años con citología anormal. La biopsia muestra células atípicas e inmaduras ocupando los 2/3 inferiores del epitelio, con inmunohistoquímica p16 positiva difusa. ¿Diagnóstico y manejo?", "opts": {"A": "LSIL; observación clínica", "B": "HSIL (CIN II); conización cervical", "C": "Carcinoma invasor; histerectomía radical", "D": "Cervicitis; antibióticos"}, "correct": "B"}, {"n": 27, "q": "¿Cuáles son los dos subtipos histológicos más frecuentes del cáncer cervical invasivo?", "opts": {"A": "Carcinoma epidermoide (80%) y adenocarcinoma (15%)", "B": "De células claras (70%) y mucinoso (20%)", "C": "Neuroendocrino (50%) y epidermoide (50%)", "D": "Sarcoma (80%) y adenoescamoso (15%)"}, "correct": "A"}, {"n": 28, "q": "¿Cuál es la principal causa de muerte en el carcinoma cervical avanzado?", "opts": {"A": "Metástasis óseas masivas", "B": "Obstrucción ureteral con hidronefrosis, pielonefritis y uremia", "C": "Embolia grasa pulmonar", "D": "Hemorragia cerebral"}, "correct": "B"}, {"n": 29, "q": "¿Cuál es el rasgo histológico distintivo de la fase secretora precoz (días 16-17)?", "opts": {"A": "Glándulas en diente de sierra", "B": "Vacuolas secretoras subnucleares", "C": "Descomposición hemorrágica del estroma", "D": "Mitosis abundantes sin secreción"}, "correct": "B"}, {"n": 30, "q": "¿Cuál es la causa más común de sangrado uterino anómalo en la mujer posmenopáusica?", "opts": {"A": "Complicaciones de la gestación", "B": "Anovulación puberal", "C": "Atrofia endometrial y lesiones anatómicas (pólipos, hiperplasia, cáncer)", "D": "Coagulopatías congénitas"}, "correct": "C"}, {"n": 31, "q": "¿Qué hallazgo es indispensable para diagnosticar endometritis crónica?", "opts": {"A": "Neutrófilos intraepiteliales", "B": "Células plasmáticas en el estroma", "C": "Folículos linfoides aislados", "D": "Glándulas dilatadas"}, "correct": "B"}, {"n": 32, "q": "¿Cuál es la teoría más común sobre el origen de la endometriosis y su sitio más frecuente?", "opts": {"A": "Metástasis linfática; cuello uterino", "B": "Regurgitación retrógrada menstrual; ovarios", "C": "Metaplasia estromal; trompas", "D": "Trasplante iatrogénico; cicatrices"}, "correct": "B"}, {"n": 33, "q": "¿Qué define a la adenomiosis uterina?", "opts": {"A": "Endometrio sobre la serosa ovárica", "B": "Glándulas y estroma endometrial dentro del miometrio", "C": "Proliferación benigna de músculo liso", "D": "Metaplasia tubárica del endocérvix"}, "correct": "B"}, {"n": 34, "q": "¿Cuál es la causa hormonal y la alteración molecular típica de la hiperplasia endometrial?", "opts": {"A": "Exceso de progesterona; mutación TP53", "B": "Estrógenos sin oposición; inactivación de PTEN", "C": "Déficit estrogénico; reordenamiento MED12", "D": "Prolactina elevada; translocación HER2"}, "correct": "B"}, {"n": 35, "q": "¿Qué riesgo clínico implica el diagnóstico de hiperplasia endometrial atípica?", "opts": {"A": "Ninguno, remite sola siempre", "B": "Hallazgo de adenocarcinoma concurrente en hasta 50% de las histerectomías", "C": "Invasión miometrial inmediata en el 100%", "D": "Metástasis ováricas fulminantes"}, "correct": "B"}, {"n": 36, "q": "¿Qué perfil corresponde al carcinoma endometrial de Tipo II (seroso)?", "opts": {"A": "Edad joven, asociado a obesidad y mutación en PTEN", "B": "Edad de 65-75 años, endometrio atrófico y mutación de TP53 (>90%)", "C": "Frecuente, bien diferenciado y de pronóstico favorable", "D": "Dependiente de estrógenos con hiperplasia previa"}, "correct": "B"}, {"n": 37, "q": "Mujer de 62 años, obesa, con metrorragia posmenopáusica. La biopsia muestra glándulas apretadas \"espalda con espalda\", <5% de patrón sólido, pérdida de PTEN y p53 normal. ¿Diagnóstico?", "opts": {"A": "Carcinoma seroso de alto grado", "B": "Adenocarcinoma endometrioide bien diferenciado (grado 1)", "C": "Pólipo endometrial atrófico", "D": "Leiomiosarcoma uterino"}, "correct": "B"}, {"n": 38, "q": "¿Cuál es la lesión precursora del carcinoma seroso endometrial y cómo se disemina precozmente?", "opts": {"A": "Hiperplasia simple; por vía hematógena", "B": "Carcinoma intraepitelial endometrial seroso; descamación por las trompas al peritoneo", "C": "Pólipo hiperplásico; invasión vesical directa", "D": "Adenoma endocervical; vía linfática inguinal"}, "correct": "B"}, {"n": 39, "q": "¿Cuál es el origen de los carcinosarcomas uterinos (tumores müllerianos mixtos)?", "opts": {"A": "Colisión accidental de dos tumores distintos", "B": "Carcinomas que sufren transdiferenciación o metaplasia mesenquimatosa", "C": "Sarcomas que generan glándulas benignas", "D": "Tumores derivados de restos de la placenta"}, "correct": "B"}, {"n": 40, "q": "¿Qué criterios morfológicos diferencian un leiomiosarcoma de un leiomioma benigno?", "opts": {"A": "Atipia nuclear marcada, necrosis tumoral y mitosis abundantes (≥10 por 10 CGA)", "B": "Tumor múltiple, menor de 3 cm y consistencia dura", "C": "Patrón en remolinos y degeneración hialina", "D": "Presencia de cápsula fibrosa completa"}, "correct": "A"}, {"n": 41, "q": "¿Cuál es la alteración clínica y hormonal central en el síndrome de ovario poliquístico (SOP)?", "opts": {"A": "Hipoestrogenismo e hipotensión", "B": "Hiperandrogenismo, anovulación crónica y resistencia a la insulina", "C": "Hipertiroidismo primario y galactorrea", "D": "Secreción aislada de gonadotropina coriónica"}, "correct": "B"}, {"n": 42, "q": "¿Qué neoplasia presenta mayor riesgo de desarrollarse en pacientes con SOP?", "opts": {"A": "Carcinoma seroso de alto grado", "B": "Hiperplasia y adenocarcinoma endometrioide", "C": "Carcinosarcoma uterino", "D": "Teratoma inmaduro"}, "correct": "B"}, {"n": 43, "q": "¿Qué hallazgo histológico define a la hipertecosis estromal del ovario?", "opts": {"A": "Infiltrado inflamatorio con células plasmáticas", "B": "Nidos de células estromales lúteas ricas en lípidos", "C": "Cuerpos de psamoma corticales", "D": "Quistes tapizados por epitelio ciliado"}, "correct": "B"}, {"n": 44, "q": "¿Cuál es el origen de la mayoría de los cánceres malignos primarios de ovario?", "opts": {"A": "Células germinales pluripotentes", "B": "Epitelio de superficie de tipo mülleriano", "C": "Cordones sexuales gonadales", "D": "Células endoteliales vasculares"}, "correct": "B"}, {"n": 45, "q": "¿Cuál es el tipo histológico más frecuente de cáncer maligno de ovario?", "opts": {"A": "Cistoadenoma mucinoso", "B": "Carcinoma seroso de alto grado", "C": "Tumor de células claras", "D": "Carcinoma endometrioide"}, "correct": "B"}, {"n": 46, "q": "Las mutaciones hereditarias en BRCA1 y BRCA2 predisponen principalmente a:", "opts": {"A": "Teratoma maduro benigno", "B": "Carcinoma seroso de alto grado", "C": "Tumor de Brenner", "D": "Disgerminoma puro"}, "correct": "B"}, {"n": 47, "q": "¿Qué alteración molecular está presente en casi el 100% de los carcinomas serosos de alto grado?", "opts": {"A": "Mutaciones aisladas de KRAS", "B": "Mutaciones del gen TP53", "C": "Mutación puntual de FOXL2", "D": "Pérdida única de MED12"}, "correct": "B"}, {"n": 48, "q": "¿Cómo se denominan las calcificaciones concéntricas laminadas en los tumores serosos?", "opts": {"A": "Cuerpos de Call-Exner", "B": "Cuerpos de psamoma", "C": "Cuerpos de Schiller-Duval", "D": "Cristaloides de Reinke"}, "correct": "B"}, {"n": 49, "q": "¿Qué mutación génica inicial es constante y característica en los tumores mucinosos de ovario?", "opts": {"A": "BRCA1", "B": "KRAS", "C": "TP53", "D": "PTEN"}, "correct": "B"}, {"n": 50, "q": "Ante un tumor mucinoso ovárico bilateral y seudomixoma peritoneal, ¿qué origen primario debe sospecharse?", "opts": {"A": "Cuello uterino", "B": "Apéndice cecal o tubo digestivo", "C": "Endometrio atrófico", "D": "Riñón"}, "correct": "B"}, {"n": 51, "q": "¿A qué patología previa se asocian típicamente los carcinomas ováricos de células claras y endometrioides?", "opts": {"A": "Teratomas benignos", "B": "Endometriosis ovárica", "C": "Enfermedad inflamatoria pélvica", "D": "Síndrome de Turner"}, "correct": "B"}, {"n": 52, "q": "¿Qué apariencia microscópica define al carcinoma ovárico de células claras?", "opts": {"A": "Células cilíndricas llenas de mucina", "B": "Células poliédricas con citoplasma claro rico en glucógeno", "C": "Epitelio transicional idéntico a vejiga", "D": "Células fusiformes estromales"}, "correct": "B"}, {"n": 53, "q": "¿Qué tipo de células forman los nidos epiteliales del tumor de Brenner?", "opts": {"A": "Células del sincitiotrofoblasto", "B": "Células epiteliales transicionales (uroteliales)", "C": "Células escamosas maduras", "D": "Células mesoteliales vacuoladas"}, "correct": "B"}, {"n": 54, "q": "¿Cuál es el marcador sérico de referencia para monitorizar la recurrencia del cáncer epitelial de ovario?", "opts": {"A": "Alfa-fetoproteína (AFP)", "B": "CA-125", "C": "Gonadotropina coriónica (hCG)", "D": "Calcitonina"}, "correct": "B"}, {"n": 55, "q": "¿Cuál es el cariotipo habitual de los teratomas quísticos maduros?", "opts": {"A": "46,XY", "B": "46,XX", "C": "69,XXY", "D": "45,X0"}, "correct": "B"}, {"n": 56, "q": "¿Cuál es la degeneración maligna más habitual en un teratoma quístico maduro?", "opts": {"A": "Coriocarcinoma", "B": "Carcinoma epidermoide", "C": "Adenocarcinoma mucinoso", "D": "Melanoma"}, "correct": "B"}, {"n": 57, "q": "¿Cómo se denomina al teratoma monodérmico compuesto por tejido tiroideo maduro y funcionante?", "opts": {"A": "Carcinoide ovárico", "B": "Estruma ovárico", "C": "Bocio ectópico cervical", "D": "Disgerminoma tiroideo"}, "correct": "B"}, {"n": 58, "q": "¿Qué tejido fetal determina el grado histológico de malignidad en un teratoma inmaduro?", "opts": {"A": "Cartílago hialino", "B": "Neuroepitelio inmaduro", "C": "Epitelio respiratorio", "D": "Hueso lamelar"}, "correct": "B"}, {"n": 59, "q": "¿Cuál es el tumor ovárico germinal maligno morfológicamente idéntico al seminoma testicular?", "opts": {"A": "Carcinoma embrionario", "B": "Disgerminoma", "C": "Tumor del saco vitelino", "D": "Tumor de la granulosa"}, "correct": "B"}, {"n": 60, "q": "La presencia de cuerpos de Schiller-Duval y elevación sérica de alfa-fetoproteína (AFP) es propia de:", "opts": {"A": "Disgerminoma", "B": "Tumor del saco vitelino (seno endodérmico)", "C": "Teratoma maduro", "D": "Tumor de Brenner"}, "correct": "B"}, {"n": 61, "q": "Mujer de 21 años con dolor pélvico leve. La ecografía muestra un quiste ovárico unilocular con sebo, pelos y una pieza dentaria; la biopsia solo muestra tejidos maduros bien diferenciados. ¿Diagnóstico?", "opts": {"A": "Teratoma inmaduro grado 3", "B": "Cistoadenoma mucinoso", "C": "Teratoma quístico maduro (quiste dermoide)", "D": "Carcinoma embrionario"}, "correct": "C"}, {"n": 62, "q": "¿Qué microcavidades foliculares con material acidófilo son diagnósticas del tumor de células de la granulosa?", "opts": {"A": "Cuerpos de psamoma", "B": "Cuerpos de Call-Exner", "C": "Cuerpos de Schiller-Duval", "D": "Cristaloides de Reinke"}, "correct": "B"}, {"n": 63, "q": "¿Qué mutación somática constante se detecta en los tumores de la granulosa del adulto?", "opts": {"A": "TP53", "B": "FOXL2", "C": "KRAS", "D": "PTEN"}, "correct": "B"}, {"n": 64, "q": "¿Qué tríada define al síndrome de Meigs?", "opts": {"A": "Disgerminoma, fiebre y anemia", "B": "Fibroma ovárico, ascitis e hidrotórax", "C": "Teratoma, tiroiditis y mixedema", "D": "Tumor mucinoso, ictericia y coma"}, "correct": "B"}, {"n": 65, "q": "¿Qué manifestación endocrina provoca habitualmente el tumor de células de Sertoli-Leydig?", "opts": {"A": "Hiperestrogenismo y menarquia precoz", "B": "Desfeminización y virilización (hirsutismo y clitoromegalia)", "C": "Hipercalcemia sintomática", "D": "Hipotiroidismo refractario"}, "correct": "B"}, {"n": 66, "q": "¿Qué inclusión citoplasmática en bastoncillo es diagnóstica del tumor de células de Leydig (hiliar)?", "opts": {"A": "Cuerpos de Russell", "B": "Cristaloides de Reinke", "C": "Cuerpos de Negri", "D": "Cuerpos asteroides"}, "correct": "B"}, {"n": 67, "q": "¿Qué define anatomopatológicamente al tumor de Krukenberg?", "opts": {"A": "Neoplasia primaria urotelial", "B": "Metástasis ovárica bilateral de células en «anillo de sello» productoras de mucina", "C": "Sarcoma originado en la fimbria tubárica", "D": "Linfoma primario folicular"}, "correct": "B"}, {"n": 68, "q": "¿Cuáles son los microorganismos más frecuentes causantes de salpingitis aguda supurativa?", "opts": {"A": "Mycobacterium tuberculosis y Treponema", "B": "Neisseria gonorrhoeae y Chlamydia trachomatis", "C": "Candida albicans y Trichomonas", "D": "Citomegalovirus y VHS"}, "correct": "B"}, {"n": 69, "q": "¿Cómo se denomina la lesión precursora del carcinoma seroso de alto grado en la fimbria tubárica?", "opts": {"A": "Neoplasia intraepitelial cervical (CIN)", "B": "Carcinoma intraepitelial tubárico seroso (STIC)", "C": "Adenoma papilar tubárico", "D": "Endometrioma tubárico"}, "correct": "B"}, {"n": 70, "q": "Los quistes paratubáricos translúcidos derivados de restos müllerianos en el extremo fímbrico se conocen como:", "opts": {"A": "Quistes de Naboth", "B": "Hidátides de Morgagni", "C": "Quistes de Bartholin", "D": "Quistes de chocolate"}, "correct": "B"}, {"n": 71, "q": "¿Cuál es la causa identificable más frecuente de aborto espontáneo en el primer trimestre?", "opts": {"A": "Incompetencia cervical aislada", "B": "Anomalías cromosómicas fetales", "C": "Infección bacteriana por Listeria", "D": "Traumatismo abdominal"}, "correct": "B"}, {"n": 72, "q": "¿En qué localización ocurre el 90% de los embarazos ectópicos?", "opts": {"A": "Cavidad peritoneal pélvica", "B": "Trompa de Falopio", "C": "Cuello uterino", "D": "Corteza ovárica"}, "correct": "B"}, {"n": 73, "q": "Mujer de 28 años con amenorrea de 6 semanas y dolor agudo en fosa ilíaca derecha que entra en shock hipovolémico; la ecografía muestra masa anexial rota y hemoperitoneo masivo. ¿Diagnóstico?", "opts": {"A": "Mola hidatiforme parcial", "B": "Rotura de apendicitis flegmonosa", "C": "Embarazo ectópico tubárico roto", "D": "Torsión ovárica simple"}, "correct": "C"}, {"n": 74, "q": "El síndrome de transfusión gemelogemelar es una complicación propia de placentas:", "opts": {"A": "Dicoriónicas diamnióticas independientes", "B": "Monocoriónicas con anastomosis vasculares arteriovenosas", "C": "Placentas con cotiledones aberrantes", "D": "Con inserción velamentosa aislada"}, "correct": "B"}, {"n": 75, "q": "¿Qué alteración anatómica define a la placenta previa?", "opts": {"A": "Inserción de vellosidades directamente en el miometrio", "B": "Implantación sobre el segmento inferior cubriendo o cerca del orificio cervical interno", "C": "Desprendimiento prematuro de la placa basal", "D": "Trombosis de los vasos coriónicos"}, "correct": "B"}, {"n": 76, "q": "¿Cuál es el defecto histopatológico que define a la placenta acreta?", "opts": {"A": "Dilatación quística de todas las vellosidades", "B": "Ausencia de decidua basal con inserción directa de las vellosidades en el miometrio", "C": "Trombosis de arterias espirales", "D": "Infiltrado inflamatorio purulento agudo"}, "correct": "B"}, {"n": 77, "q": "La infección bacteriana intrauterina ascendente de las membranas fetales se manifiesta como:", "opts": {"A": "Infartos placentarios múltiples", "B": "Corioamnionitis aguda con neutrófilos", "C": "Vellositis crónica granulomatosa", "D": "Necrosis fibrinoide focal"}, "correct": "B"}, {"n": 78, "q": "¿Cuál es el defecto patogénico inicial de la preeclampsia a nivel vascular uterino?", "opts": {"A": "Trombosis de la vena umbilical", "B": "Fallo en la remodelación fisiológica de las arterias espirales por el citotrofoblasto", "C": "Aumento de prostaciclina sistémica", "D": "Vasodilatación anormal con hipotensión"}, "correct": "B"}, {"n": 79, "q": "¿Qué mediadores antiangiogénicos liberados por la placenta isquémica causan la disfunción endotelial en la preeclampsia?", "opts": {"A": "VEGF y TGF-β", "B": "sFlt-1 (tirosina cinasa soluble tipo Fms) y endoglina soluble (sEng)", "C": "Estrógenos libres y progesterona", "D": "Renina y óxido nítrico"}, "correct": "B"}, {"n": 80, "q": "¿Qué diferencia genética y morfológica básica distingue a la mola hidatiforme completa de la parcial?", "opts": {"A": "Completa tiene feto y es 46,XX; parcial no tiene feto y es 46,XY", "B": "Completa es diploide androgénica (sin feto y edema difuso); parcial es triploide (con partes fetales y edema focal)", "C": "Completa deriva de óvulo duplicado materno; parcial solo de células germinales", "D": "Completa cura siempre espontáneamente; parcial progresa en un 80% a cáncer"}, "correct": "B"}];
const letters=['A','B','C','D'];
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
function makeExam(){return questions.map(q=>{const shuffled=shuffle(Object.entries(q.opts).map(([key,text])=>({key,text})));const opts={};let correct='';shuffled.forEach((o,j)=>{opts[letters[j]]=o.text;if(o.key===q.correct)correct=letters[j];});return {...q,opts,correct};});}
let exam=makeExam();let i=0;const answers=Array(questions.length).fill(null);
const el=id=>document.getElementById(id);
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const done=answers.filter(a=>a!==null).length;
 const correct=answers.filter((a,j)=>a===exam[j].correct).length;
 el('scoreTop').textContent=i>=questions.length?'Resultado final':done+' / '+questions.length+' respondidas';
 el('bar').style.width=(i>=questions.length?100:(done/questions.length*100))+'%';
 if(i>=questions.length){
  const errors=exam.map((q,j)=>({q,a:answers[j]})).filter(({q,a})=>a!==q.correct);
  el('screen').innerHTML='<div class="result"><div class="muted">Resultado final</div><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% de aciertos · '+(questions.length-done)+' sin responder</p><button class="nav primary" id="restart">Reiniciar examen</button></div><div class="review"><h2>Revisión ('+errors.length+')</h2>'+(errors.length?errors.map(({q,a})=>'<article class="review-item"><h3>'+q.n+'. '+esc(q.q)+'</h3><p class="'+(a===null?'pending':'wrong')+'">'+(a===null?'Sin responder':'Tu respuesta: '+a+' — '+esc(q.opts[a]))+'</p><p class="right">Correcta: '+q.correct+' — '+esc(q.opts[q.correct])+'</p></article>').join(''):'<p class="right">Todas las respuestas son correctas.</p>')+'</div>';
  el('restart').addEventListener('click',()=>{answers.fill(null);exam=makeExam();i=0;render()});return;
 }
 const q=exam[i],a=answers[i];
 el('screen').innerHTML='<div class="count">PREGUNTA '+q.n+' DE '+questions.length+'</div><h2>'+esc(q.q)+'</h2><div class="choices">'+Object.entries(q.opts).map(([k,v])=>'<button type="button" '+(a!==null?'disabled ':'')+'data-choice="'+k+'" class="choice '+(a===null?'':k===q.correct?'good':a===k?'bad':'')+'"><span class="letter">'+k+'</span><span>'+esc(v)+'</span></button>').join('')+'</div>'+(a===null?'':'<div class="feedback '+(a===q.correct?'good':'bad')+'">'+(a===q.correct?'Correcto':'Incorrecto · Respuesta correcta: '+q.correct+' — '+esc(q.opts[q.correct]))+'</div>')+'<div class="bottom"><span class="small">'+(i+1)+' / '+questions.length+'</span><div class="actions"><button class="nav" id="prev" '+(i===0?'disabled':'')+'>Anterior</button><button class="nav" id="skip">'+(a===null?'Saltar':'Respondida')+'</button><button class="nav primary" id="next">'+(i===questions.length-1?'Finalizar':'Siguiente')+'</button></div></div>';
 document.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{if(answers[i]!==null)return;answers[i]=btn.dataset.choice;render()}));
 el('prev').addEventListener('click',()=>{i--;render()});
 el('skip').disabled=a!==null;el('skip').addEventListener('click',()=>{if(answers[i]===null){i++;render()}});
 el('next').addEventListener('click',()=>{i++;render()});
}
render();
</script></body></html>
